services:
  dnd-manager:
    build: .
    image: dnd-manager:latest
    container_name: dnd-manager
    restart: unless-stopped
    ports:
      # Im Heimnetz erreichbar. Von außen kommt niemand über diesen Port,
      # sondern über den Tunnel unten – der braucht keine Portfreigabe.
      - "3001:3001"
    volumes:
      - dnd-manager-data:/app/data
    environment:
      - PORT=3001
      # 2014 = klassisches 5e-SRD-Regelwerk. Für die 2024er Regeln kann
      # "https://www.dnd5eapi.co/api/2024" verwendet werden.
      - DND5E_API_BASE=https://www.dnd5eapi.co/api/2014
      # Der Tunnel unten ist der erste Zwischenschritt vor dem Almanach.
      - TRUST_PROXY=1
      # Freiwillig: die feste Adresse, unter der die Runde spielt. Damit der
      # Almanach sie beim Start nennen kann – getragen wird sie vom benannten
      # Tunnel weiter unten.
      - DOMAENE=${DOMAENE:-}
      # Freiwillig: erzählender Rückblick in der Chronik.
      - CHRONIK_KI_URL=${CHRONIK_KI_URL:-}
      - CHRONIK_KI_MODELL=${CHRONIK_KI_MODELL:-}
      - CHRONIK_KI_SCHLUESSEL=${CHRONIK_KI_SCHLUESSEL:-}
    # Ein Pi läuft monatelang durch. Ohne Grenze wächst das Protokoll, bis die
    # Karte voll ist – und dann steht alles.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Der Weg von außen, ganz ohne Portfreigabe im Router und ohne eigene
  # Domain: cloudflared baut eine Verbindung von innen nach außen auf und
  # bekommt dafür eine Adresse auf trycloudflare.com geliehen.
  #
  # Der Haken: Die Adresse ist geliehen und wechselt bei jedem Neustart des
  # Tunnels. Welche gerade gilt, sagt `scripts/adresse.sh`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dnd-manager-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://dnd-manager:3001
    depends_on:
      dnd-manager:
        # Erst aufmachen, wenn der Almanach wirklich antwortet – sonst sieht
        # die Runde beim Neustart für ein paar Sekunden einen Fehler von
        # Cloudflare statt der Anmeldeseite.
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - tunnel

  # **Eine feste Adresse gibt es hier nicht als Container.** Der Weg dorthin
  # führt über einen eigenen Vorposten: einen kleinen Server, auf den die
  # Domain zeigt und der die Anfragen durch eine SSH-Leitung hierher
  # zurückreicht. Aufgebaut wird die Leitung von hier aus, mit
  # `npm run tunnel` und einem TUNNEL_ZIEL in der `.env` – dafür braucht es
  # keinen Container, nur `ssh`. Siehe docs/EINRICHTUNG.md, Schritt 6.5.

volumes:
  dnd-manager-data:
