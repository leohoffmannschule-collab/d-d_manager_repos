<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#382718" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Almanach" />
    <meta name="description" content="Charaktermanager für D&D 5e und andere Pen & Paper Rollenspiele – lokal gehostet, für iPad und iPhone." />
    <title>Abenteuer-Almanach</title>
    <script>
      // Gewähltes Aussehen sofort setzen, damit beim Start nichts aufblitzt.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('almanach-theme') || 'pergament';
      } catch (e) {
        document.documentElement.dataset.theme = 'pergament';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
