<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');
    body { margin: 0; font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; }
    a { color: #9a2b22; text-decoration: none; }
    a:hover { color: #6f1d17; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; position: relative; background-color: #e6d7b0; background-image: radial-gradient(ellipse at 18% 12%, rgba(255,250,235,0.60), transparent 55%), radial-gradient(ellipse at 82% 68%, rgba(150,120,78,0.20), transparent 60%); color: #2b2114;">

  <!-- Kopfleiste -->
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 56px; background-color: #382718; background-image: linear-gradient(180deg, rgba(255,225,170,0.10), rgba(0,0,0,0.18)); border-bottom: 2px solid #b8912f; flex-shrink: 0;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d9b451" stroke-width="1.4" stroke-linejoin="round">
      <path d="M12 2.6 20.2 7v10L12 21.4 3.8 17V7z"></path>
      <path d="M12 2.6 20.2 7 12 11.4 3.8 7z"></path>
      <path d="M12 11.4V21.4"></path>
    </svg>
    <span style="font-family: 'Cinzel', Georgia, serif; font-size: 15px; font-weight: 600; letter-spacing: 0.14em; color: #e8cf8d; text-transform: uppercase;">Almanach</span>
  </div>

  <!-- Blatt im Hintergrund -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 54px; height: 54px; border-radius: 50%; flex-shrink: 0; background-color: #d8c49a; box-shadow: 0 0 0 2px #b8912f, 0 0 0 4px #e6d7b0, 0 0 0 5px #a3865c; display: flex; align-items: center; justify-content: center;">
        <span style="font-family: 'Cinzel', Georgia, serif; font-size: 28px; font-weight: 600; color: #9a2b22;">E</span>
      </div>
      <div>
        <div style="font-family: 'Cinzel', Georgia, serif; font-size: 20px; font-weight: 600; color: #2b2114;">Elara Nachtwind</div>
        <div style="font-size: 15px; font-style: italic; color: #6d5c45;">Waldläuferin · Stufe 5</div>
      </div>
    </div>
    <div style="padding: 14px 16px; background-color: #f4ead2; border: 1px solid #c2a878;">
      <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 10px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#b8912f" stroke="none"><path d="M12 2.5 14 9l6.5 1.5L15.5 15l1.5 6.5L12 18l-5 3.5L8.5 15 3.5 10.5 10 9z"></path></svg>
        <span style="font-family: 'Cinzel', Georgia, serif; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: #9a2b22; text-transform: uppercase;">Kampfwerte</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-family: 'Cinzel', Georgia, serif; font-size: 9px; letter-spacing: 0.14em; color: #8a7355; text-transform: uppercase;">Rüstung</span>
          <span style="font-family: 'Cinzel', Georgia, serif; font-size: 21px; font-weight: 700; color: #2b2114;">16</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-family: 'Cinzel', Georgia, serif; font-size: 9px; letter-spacing: 0.14em; color: #8a7355; text-transform: uppercase;">Initiative</span>
          <span style="font-family: 'Cinzel', Georgia, serif; font-size: 21px; font-weight: 700; color: #2b2114;">+4</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-family: 'Cinzel', Georgia, serif; font-size: 9px; letter-spacing: 0.14em; color: #8a7355; text-transform: uppercase;">Bewegung</span>
          <span style="font-family: 'Cinzel', Georgia, serif; font-size: 21px; font-weight: 700; color: #2b2114;">35</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Abdunklung -->
  <div style="position: absolute; inset: 0; background-color: rgba(40,28,14,0.55);"></div>

  <!-- Würfelbeutel -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px 18px 26px; background-color: #f2e7cd; border-top: 2px solid #b8912f; box-shadow: 0 -6px 22px rgba(40,28,14,0.35);">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a2b22" stroke-width="1.3" stroke-linejoin="round">
          <path d="M12 2.6 20.2 7v10L12 21.4 3.8 17V7z"></path>
          <path d="M12 2.6 20.2 7 12 11.4 3.8 7zM12 11.4V21.4"></path>
        </svg>
        <span style="font-family: 'Cinzel', Georgia, serif; font-size: 17px; font-weight: 600; letter-spacing: 0.12em; color: #9a2b22; text-transform: uppercase;">Würfelbeutel</span>
      </div>
      <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid #c2a878;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6d5c45" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"></path></svg>
      </div>
    </div>

    <div style="display: flex; gap: 12px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-family: 'Cinzel', Georgia, serif; font-size: 10px; letter-spacing: 0.16em; color: #8a7355; text-transform: uppercase;">Anzahl</span>
        <div style="display: flex; align-items: center; height: 46px; padding: 0 14px; background-color: #f8f0dc; border: 1px solid #c2a878; font-family: 'Cinzel', Georgia, serif; font-size: 19px; color: #2b2114;">2</div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-family: 'Cinzel', Georgia, serif; font-size: 10px; letter-spacing: 0.16em; color: #8a7355; text-transform: uppercase;">Modifikator</span>
        <div style="display: flex; align-items: center; height: 46px; padding: 0 14px; background-color: #f8f0dc; border: 1px solid #c2a878; font-family: 'Cinzel', Georgia, serif; font-size: 19px; color: #2b2114;">+7</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px;">
      <div style="height: 52px; display: flex; align-items: center; justify-content: center; background-color: #f8f0dc; border: 1px solid #c2a878; font-family: 'Cinzel', Georgia, serif; font-size: 17px; color: #2b2114;">W4</div>
      <div style="height: 52px; display: flex; align-items: center; justify-content: center; background-color: #f8f0dc; border: 1px solid #c2a878; font-family: 'Cinzel', Georgia, serif; font-size: 17px; color: #2b2114;">W6</div>
      <div style="height: 52px; display: flex; align-items: center; justify-content: center; background-color: #f8f0dc; border: 1px solid #c2a878; font-family: 'Cinzel', Georgia, serif; font-size: 17px; color: #2b2114;">W8</div>
      <div style="height: 52px; display: flex; align-items: center; justify-content: center; background-color: #f8f0dc; border: 1px solid #c2a878; font-family: 'Cinzel', Georgia, serif; font-size: 17px; color: #2b2114;">W10</div>
      <div style="height: 52px; display: flex; align-items: center; justify-content: center; background-color: #f8f0dc; border: 1px solid #c2a878; font-family: 'Cinzel', Georgia, serif; font-size: 17px; color: #2b2114;">W12</div>
      <div style="height: 52px; display: flex; align-items: center; justify-content: center; background-color: #9a2b22; border: 1px solid #7d2018; box-shadow: 0 0 0 1px #b8912f inset; font-family: 'Cinzel', Georgia, serif; font-size: 17px; font-weight: 600; color: #f0dca8;">W20</div>
      <div style="height: 52px; display: flex; align-items: center; justify-content: center; background-color: #f8f0dc; border: 1px solid #c2a878; font-family: 'Cinzel', Georgia, serif; font-size: 17px; color: #2b2114;">W100</div>
      <div style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px dashed #b39a70;">
        <span style="font-size: 13px; font-style: italic; color: #8a7355;">leeren</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-family: 'Cinzel', Georgia, serif; font-size: 11px; letter-spacing: 0.16em; color: #8a7355; text-transform: uppercase;">Wurfchronik</span>
        <span style="flex-grow: 1; height: 1px; background-color: #c9b48c;"></span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; background-color: rgba(216,180,81,0.20); border-left: 3px solid #b8912f;">
        <span style="font-size: 16px; color: #4a3d2c;">2W20+7 <span style="color: #8a7355;">[18, 11]</span></span>
        <span style="font-family: 'Cinzel', Georgia, serif; font-size: 24px; font-weight: 700; color: #9a2b22;">36</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 14px;">
        <span style="font-size: 16px; color: #6d5c45;">1W8+4 <span style="color: #a3927a;">[6]</span></span>
        <span style="font-family: 'Cinzel', Georgia, serif; font-size: 19px; color: #6d5c45;">10</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 14px;">
        <span style="font-size: 16px; color: #6d5c45;">1W20+6 <span style="color: #a3927a;">[3]</span></span>
        <span style="font-family: 'Cinzel', Georgia, serif; font-size: 19px; color: #6d5c45;">9</span>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
